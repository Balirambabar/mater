<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>User Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--to add icon need to add below css
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #f8f9fa; }
        .card { text-align: center; }
        .card h2 { font-size: 2.5rem; margin: 0; }
        .navbar-brand img {
          height: 50px;           /* Balanced logo */
          width: auto;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <!-- Navbar-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <img alt="logo" class="me-2" src="img/jaybabajilogo.jpeg" style="height:40px;">
                <span class="fw-bold">Jay Babaji</span>
            </a>

            <!-- Toggler button for mobile --when mobile screen it will show home ,view enquiry-->
            <button aria-controls="navbarSupportedContent" aria-expanded="false"
                    aria-label="Toggle navigation"
                    class="navbar-toggler"
                    data-bs-target="#navbarSupportedContent"
                    data-bs-toggle="collapse"
                    type="button">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Collapsible content-->
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="/index">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/addEnquiry">Add Enquiry</a></li>
                    <li class="nav-item"><a class="nav-link" href="/viewEnquiry">View Enquiry</a></li>
                </ul>
                <a class="btn btn-outline-light" href="/index">Logout</a>
            </div>
        </div>
    </nav>
    <h2 class="mb-4 text-center">Performance Dashboard</h2>
    <div class="row g-4 text-center">
        <div class="col-md-4">
            <div class="card shadow border-primary">
                <div class="card-body">
                    <i class="bi bi-people-fill text-primary fs-1"></i>
                    <h5 class="card-title mt-2">Total Enquiries</h5>
                    <h2 class="fw-bold text-primary" th:text="${total}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow border-success">
                <div class="card-body">
                    <i class="bi bi-check-circle-fill text-success fs-1"></i>
                    <h5 class="card-title mt-2">Enrolled</h5>
                    <h2 class="fw-bold text-success" th:text="${enrolled}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow border-danger">
                <div class="card-body">
                    <i class="bi bi-x-circle-fill text-danger fs-1"></i>
                    <h5 class="card-title mt-2">Lost</h5>
                    <h2 class="fw-bold text-danger" th:text="${lost}">0</h2>
                </div>
            </div>
        </div>
    </div>

    <!-- Chart Section-->
    <div class="card shadow mt-5 mx-auto" style="max-width: 400px;">
        <div class="card-body">
            <h5 class="card-title text-center mb-3">Enquiry Status Breakdown</h5>
            <canvas id="enquiryChart" style="height:250px;"></canvas>
        </div>
    </div>
    <script>
        // Chart.js Pie Chart
        const ctx = document.getElementById('enquiryChart').getContext('2d');
        const enquiryChart = new Chart(ctx, {
          type: 'pie',
          data: {
            labels: ['Enrolled', 'Lost', 'Pending'],
            datasets: [{
              data: [
                /* Thymeleaf variables injected from Spring Boot */
                [[${enrolled}]],
                [[${lost}]],
                [[${total - (enrolled + lost)}]]
              ],
              backgroundColor: ['#198754', '#dc3545', '#ffc107'], // green, red, yellow
              borderColor: '#fff',
              borderWidth: 2
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: {
                position: 'bottom'
              }
            }
          }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>

</html>
