<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Unlock Account - Jay Babaji</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
          background: linear-gradient(135deg, #f8f9fa, #e9ecef); /* subtle gradient */
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          margin: 0;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .form-card {
          width: 100%;
          max-width: 450px;
          padding: 2rem;
          border-radius: 12px;
          background: #fff;
          box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }
        .form-card h3 {
          text-align: center;
          margin-bottom: 1.5rem;
          font-weight: 600;
          color: #343a40;
        }
        .brand-logo {
          display: block;
          margin: 0 auto 1rem auto;
          height: 60px;
        }
        .form-card .btn {
          margin-top: 0.5rem;
        }
        .extra-links {
          text-align: center;
          margin-top: 1rem;
        }
    </style>
</head>
<body>

<div class="form-card">
    <!-- Logo
    <img alt="Jay Babaji Logo" class="brand-logo" src="img/jaybabajilogo.jpeg">

    <h3>Unlock Your Account</h3>

    <!-- Form
    <form action="/submitForm" method="post">

        <!-- Temporary Password
        <div class="mb-3">
            <input class="form-control" id="tempPass" name="tempPass" placeholder="Enter temporary password" required
                   type="password">
        </div>

        <!-- New Password
        <div class="mb-3">
            <input class="form-control" id="newPassword" name="newPassword" placeholder="Enter new password" required
                   type="password">
        </div>

        <!-- Confirm Password
        <div class="mb-3">
            <input class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Re-enter new password"
                   required type="password">
        </div>

        <!-- Submit Button
        <button class="btn btn-primary w-100" type="submit">Unlock</button>

        <!-- Extra Links
        <div class="extra-links">
            <p class="mt-3 mb-1">Already unlocked?</p>
            <a class="btn btn-outline-secondary w-100" href="/login">Login Here</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
