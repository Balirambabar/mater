<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>View Enquiries - Jay Babaji</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .navbar-brand img { height: 40px; width: auto; }
        .table thead th { text-align: center; }
        .table tbody td { vertical-align: middle; }
    </style>
</head>
<body>

<!-- Navbar-->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img alt="logo" class="me-2" src="img/jaybabajilogo.jpeg">
            <span class="fw-bold">Jay Babaji</span>
        </a>
        <button class="navbar-toggler" data-bs-target="#navbarNav" data-bs-toggle="collapse" type="button">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/dashBoard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/addEnquiry">Add Enquiry</a></li>
                <li class="nav-item"><a class="nav-link active" href="/viewEnquiry">View Enquiries</a></li>
            </ul>
            <a class="btn btn-outline-light" href="/index">Logout</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h2 class="mb-4 text-center">All Enquiries</h2>

    <!-- Search bar-->
    <form action="/viewEnquiry" class="d-flex mb-3" method="get">
        <input class="form-control me-2" name="keyword" placeholder="Search by name or mobile" type="search">
        <button class="btn btn-outline-primary" type="submit"><i class="bi bi-search"></i> Search</button>
    </form>

    <!-- Enquiry Table-->
    <div class="card shadow">
        <div class="card-body">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Mobile</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Status</th>
                    <th>Notes</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="enquiry : ${enquiries}">
                    <td th:text="${enquiry.id}">1</td>
                    <td th:text="${enquiry.name}">John Doe</td>
                    <td th:text="${enquiry.mobile}">9876543210</td>
                    <td th:text="${enquiry.email}">john@example.com</td>
                    <td th:text="${enquiry.course}">Java</td>
                    <td>
              <span th:classappend="${enquiry.status == 'ENROLLED'} ? 'badge bg-success' :
                                    (enquiry.status == 'LOST') ? 'badge bg-danger' : 'badge bg-secondary'"
                    th:text="${enquiry.status}">
                NEW
              </span>
                    </td>
                    <td th:text="${enquiry.notes}">Interested in weekend batch</td>
                    <td class="text-center">
                        <a class="btn btn-sm btn-warning me-1" th:href="@{/editEnquiry/{id}(id=${enquiry.id})}">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a class="btn btn-sm btn-danger" th:href="@{/deleteEnquiry/{id}(id=${enquiry.id})}">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- Pagination placeholder-->
            <nav aria-label="Page navigation" th:if="${totalPages > 1}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/viewEnquiry(page=${currentPage-1})}">Previous</a>
                    </li>
                    <li class="page-item" th:classappend="${i == currentPage} ? 'active'"
                        th:each="i : ${#numbers.sequence(0, totalPages-1)}">
                        <a class="page-link" th:href="@{/viewEnquiry(page=${i})}" th:text="${i+1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages-1} ? 'disabled'">
                        <a class="page-link" th:href="@{/viewEnquiry(page=${currentPage+1})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
